<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DRUN VPN</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 12px 15px;
            background: #0d0f17;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 10px;
        }

        .header {
            text-align: center;
            width: 100%;
        }
        .app-title {
            font-size: 22px;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            margin-bottom: 2px;
        }
        .status-text {
            font-size: 20px;
            font-weight: 800;
            margin-top: 4px;
            color: #ff4757;
            transition: color 0.3s;
            letter-spacing: 0.5px;
        }

        .timer {
            font-size: 12px;
            color: #2ed573;
            margin-top: 6px;
            font-family: monospace;
            text-align: center;
            background: #161824;
            border: 1px solid #23273a;
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
        }

        .power-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
        }
        .power-btn {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #161824;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #ff4757;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .power-btn img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            pointer-events: none;
            transition: transform 0.3s ease;
        }
        .power-btn:active {
            transform: scale(0.95);
        }
        .power-btn.connecting {
            border-color: #ffa502;
            animation: spin 1s infinite linear;
        }
        .power-btn.connected {
            border-color: #2ed573;
            box-shadow: 0 0 35px rgba(46, 213, 115, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ip-card {
            background: #161824;
            border: 1px solid #23273a;
            padding: 8px 20px;
            border-radius: 14px;
            text-align: center;
            display: inline-block;
        }
        .ip-label {
            font-size: 11px;
            color: #5c627a;
        }
        .ip-value {
            font-size: 16px;
            font-weight: 700;
            font-family: monospace;
            margin-top: 2px;
            transition: color 0.3s;
        }
        .ip-value.disconnected {
            color: #ff4757;
        }
        .ip-value.connected {
            color: #9aa0b4;
        }

        .location-card {
            background: #161824;
            border: 1px solid #23273a;
            width: 100%;
            max-width: 350px;
            padding: 12px 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }
        .location-card:active {
            background: #1f2233;
        }
        .location-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .flag {
            font-size: 26px;
        }
        .country-name {
            font-size: 15px;
            font-weight: 700;
        }
        .city-name {
            font-size: 12px;
            color: #5c627a;
            margin-top: 1px;
        }
        .arrow-icon {
            color: #5c627a;
            font-size: 16px;
            font-weight: bold;
        }

        .stats-grid {
            width: 100%;
            max-width: 350px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: #161824;
            border: 1px solid #23273a;
            padding: 10px;
            border-radius: 14px;
            text-align: center;
        }
        .stat-val {
            font-size: 15px;
            font-weight: 700;
            margin-top: 2px;
        }
        .stat-title {
            font-size: 11px;
            color: #5c627a;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            background: #161824;
            border: 1px solid #23273a;
            width: 100%;
            max-width: 450px;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.active .modal-sheet {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }
        .close-btn {
            background: #23273a;
            border: none;
            color: #aaa;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }
        .country-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        .country-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d0f17;
            border: 1px solid #23273a;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
        }
        .country-item.active {
            border-color: #007aff;
            background: #12182b;
        }
        .radio-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #5c627a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .country-item.active .radio-dot {
            border-color: #007aff;
            background: #007aff;
        }
        .radio-dot::after {
            content: '';
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            display: none;
        }
        .country-item.active .radio-dot::after {
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="app-title">DRUN VPN</div>
        <div class="status-text" id="status-text">НЕ ПОДКЛЮЧЕНО</div>
        <div class="timer" id="timer">Время: 00:00:00</div>
    </div>

    <div class="power-wrapper">
        <button class="power-btn" id="power-btn">
            <img src="character.png" alt="Drun Character">
        </button>
    </div>

    <div class="ip-card">
        <div class="ip-label">Ваш IP-адрес</div>
        <div class="ip-value disconnected" id="ip-address">195.82.14.102</div>
    </div>

    <div class="location-card" id="location-card">
        <div class="location-info">
            <span class="flag" id="flag-icon">🇳🇱</span>
            <div>
                <div class="country-name" id="country-name">Нидерланды</div>
                <div class="city-name" id="city-name">Амстердам</div>
            </div>
        </div>
        <span class="arrow-icon">❯</span>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">📥 Скачано</div>
            <div class="stat-val" id="down-speed" style="color: #00d4ff;">0 MB</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">📤 Отправлено</div>
            <div class="stat-val" id="up-speed" style="color: #ff007f;">0 MB</div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-sheet">
            <div class="modal-header">
                <div class="modal-title">Выберите сервер</div>
                <button class="close-btn" id="close-modal">✕</button>
            </div>
            <div class="country-list" id="country-list"></div>
        </div>
    </div>

    <script>
        const realIP = "195.82.14.102";
        let isConnected = false;
        let isConnecting = false;

        const servers = [
            { id: 'nl', flag: '🇳🇱', country: 'Нидерланды', city: 'Амстердам', ip: '185.220.101.5' },
            { id: 'us', flag: '🇺🇸', country: 'США', city: 'Нью-Йорк', ip: '104.244.76.13' },
            { id: 'de', flag: '🇩🇪', country: 'Германия', city: 'Франкфурт', ip: '194.26.29.80' },
            { id: 'jp', flag: '🇯🇵', country: 'Япония', city: 'Токио', ip: '45.14.224.15' },
            { id: 'gb', flag: '🇬🇧', country: 'Великобритания', city: 'Лондон', ip: '89.238.130.22' }
        ];

        let selectedServer = servers[0];
        let downloaded = 0;
        let uploaded = 0;
        let secondsConnected = 0;
        let trafficInterval = null;
        let timerInterval = null;

        const powerBtn = document.getElementById('power-btn');
        const statusText = document.getElementById('status-text');
        const ipAddress = document.getElementById('ip-address');
        const flagIcon = document.getElementById('flag-icon');
        const countryName = document.getElementById('country-name');
        const cityName = document.getElementById('city-name');
        
        const locationCard = document.getElementById('location-card');
        const modalOverlay = document.getElementById('modal-overlay');
        const closeModalBtn = document.getElementById('close-modal');
        const countryListEl = document.getElementById('country-list');

        const downEl = document.getElementById('down-speed');
        const upEl = document.getElementById('up-speed');
        const timerEl = document.getElementById('timer');

        locationCard.addEventListener('click', () => {
            renderCountryList();
            modalOverlay.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('active');
        });

        function renderCountryList() {
            countryListEl.innerHTML = '';
            servers.forEach(s => {
                const item = document.createElement('div');
                item.className = `country-item ${s.id === selectedServer.id ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="location-info">
                        <span class="flag">${s.flag}</span>
                        <div>
                            <div class="country-name">${s.country}</div>
                            <div class="city-name">${s.city}</div>
                        </div>
                    </div>
                    <div class="radio-dot"></div>
                `;
                item.addEventListener('click', () => {
                    selectedServer = s;
                    updateLocationCard();
                    if (isConnected) {
                        ipAddress.innerText = selectedServer.ip;
                    }
                    modalOverlay.classList.remove('active');
                });
                countryListEl.appendChild(item);
            });
        }

        function updateLocationCard() {
            flagIcon.innerText = selectedServer.flag;
            countryName.innerText = selectedServer.country;
            cityName.innerText = selectedServer.city;
        }

        powerBtn.addEventListener('click', () => {
            if (isConnecting) return;

            if (!isConnected) {
                isConnecting = true;
                powerBtn.classList.add('connecting');
                statusText.innerText = "ПОДКЛЮЧЕНИЕ...";
                statusText.style.color = "#ffa502";

                setTimeout(() => {
                    isConnecting = false;
                    isConnected = true;
                    powerBtn.classList.remove('connecting');
                    powerBtn.classList.add('connected');
                    
                    statusText.innerText = "ПОДКЛЮЧЕНО";
                    statusText.style.color = "#2ed573";

                    ipAddress.innerText = selectedServer.ip;
                    ipAddress.classList.remove('disconnected');
                    ipAddress.classList.add('connected');

                    startStats();

                    // Сигнал для Android: запустить реальный VPN
                    if (window.AndroidVPN && typeof window.AndroidVPN.startVpn === 'function') {
                        window.AndroidVPN.startVpn();
                    }
                }, 1500);

            } else {
                isConnected = false;
                powerBtn.classList.remove('connected');
                
                statusText.innerText = "НЕ ПОДКЛЮЧЕНО";
                statusText.style.color = "#ff4757";

                ipAddress.innerText = realIP;
                ipAddress.classList.remove('connected');
                ipAddress.classList.add('disconnected');

                stopStats();

                // Сигнал для Android: отключить реальный VPN
                if (window.AndroidVPN && typeof window.AndroidVPN.stopVpn === 'function') {
                    window.AndroidVPN.stopVpn();
                }
            }
        });

        function startStats() {
            trafficInterval = setInterval(() => {
                downloaded += parseFloat((Math.random() * 2.2).toFixed(1));
                uploaded += parseFloat((Math.random() * 0.7).toFixed(1));
                downEl.innerText = downloaded.toFixed(1) + " MB";
                upEl.innerText = uploaded.toFixed(1) + " MB";
            }, 1000);

            timerInterval = setInterval(() => {
                secondsConnected++;
                const hrs = String(Math.floor(secondsConnected / 3600)).padStart(2, '0');
                const mins = String(Math.floor((secondsConnected % 3600) / 60)).padStart(2, '0');
                const secs = String(secondsConnected % 60).padStart(2, '0');
                timerEl.innerText = `Время сессии: ${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        function stopStats() {
            clearInterval(trafficInterval);
            clearInterval(timerInterval);
            secondsConnected = 0;
            downloaded = 0;
            uploaded = 0;
            downEl.innerText = "0 MB";
            upEl.innerText = "0 MB";
            timerEl.innerText = "Время сессии: 00:00:00";
        }

        updateLocationCard();
    </script>
</body>
</html>
